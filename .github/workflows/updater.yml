name: Firebase Time Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Time Request
        run: |
          curl -X PUT "https://music-17150-default-rtdb.firebaseio.com/server_time.json" \
               -H "Content-Type: application/json" \
               -d '{\".sv\": \"timestamp\"}'
